# Optional: self-hosted Telegram Bot API server.
# Raises file download limit from 20MB (official cloud API) to 2000MB (2GB).
#
# Setup:
# 1. Get api_id and api_hash from https://my.telegram.org (API Development Tools)
# 2. Create a .env.docker file with:
#      TELEGRAM_API_ID=your_api_id
#      TELEGRAM_API_HASH=your_api_hash
# 3. Run: docker compose up -d
# 4. In your bot's .env, set:
#      TELEGRAM_API_ROOT=http://localhost:8081

version: "3.8"

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8081:8081"
    volumes:
      - ./bot-api-data:/var/lib/telegram-bot-api
    command: >
      --local
      --api-id=${TELEGRAM_API_ID}
      --api-hash=${TELEGRAM_API_HASH}
